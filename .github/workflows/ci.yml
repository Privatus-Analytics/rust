name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  core:
    name: Core on Rust ${{ matrix.rust }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        rust: ["1.75", stable, beta]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      # The dev-dependencies need a newer Rust, so on 1.75 only build the library.
      - if: matrix.rust == '1.75'
        run: |
          rm -f Cargo.lock
          sed -i '/^\[dev-dependencies\]/,/^\[/{/^\[dev-dependencies\]/!{/^\[/!d}}' Cargo.toml
          cargo build --lib --no-default-features
      - if: matrix.rust != '1.75'
        run: cargo test --no-default-features

  features:
    name: All features
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --all-features
      - run: cargo test --all-features --release
      - run: cargo test --features axum
      - run: cargo test --features actix
      - run: cargo test --features askama
      - run: cargo test --features maud

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo clippy --all-targets -- -D warnings

  docs-and-package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo doc --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo package
